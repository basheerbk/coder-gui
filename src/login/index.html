<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — TinkerBit</title>
  <meta name="description" content="Sign in with Google to open the TinkerBit IDE and upload programs to your board.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FF6B35">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <link rel="canonical" href="https://tinkerbit.io/login">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">TB</span>
        <span>TinkerBit</span>
      </a>
      <h1 id="login-title">Sign in to open the IDE</h1>
      <p class="lead">
        Use a parent or school Google account. Guests can’t open the IDE until you sign in.
      </p>
      <p class="error" id="loginError" hidden></p>
      <a class="google-btn" id="googleBtn" href="/api/auth/google?next=/ide">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.3 3.8-4.7 6.6-8.8 7.3l.1.1 6.2 5.2C36.8 38.5 44 33 44 24c0-1.3-.1-2.5-.4-3.5z"/>
        </svg>
        Continue with Google
      </a>
      <p class="note">
        After you sign in you’ll return to the IDE. Code Upload still needs Chrome or Edge on a desktop.
      </p>
      <a class="back" href="/">Back to TinkerBit</a>
    </section>
  </main>
  <script src="/static/login/login.js" defer></script>
</body>
</html>
