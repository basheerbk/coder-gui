# TinkerBit Cloud front door on api.tinkerbit.io. Installed by install-on-ec2.sh to
# /etc/nginx/sites-available/tinkerbit-iot (Ubuntu) or /etc/nginx/conf.d/tinkerbit-iot.conf
# (Amazon Linux) after certbot has issued the certificate; the HTTP-only bootstrap block
# is written by the script.
#
#   /iot/v1/       -> IoT API (127.0.0.1:20114), reached by browsers via the Vercel
#                     rewrite /api/iot/* so the tb_session cookie stays first-party
#   /iot/v1/live   -> live dashboard WebSocket (single-use ticket auth)
#   /mqtt          -> Mosquitto WebSocket listener (127.0.0.1:9001), board fallback
#                     when port 8883 is blocked
#   /api/compile   -> compile API over HTTPS (same upstream as the port 80 site)

limit_req_zone $binary_remote_addr zone=tb_iot_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=tb_iot_ticket:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=tb_iot_conn:10m;

upstream tinkerbit_iot {
    server 127.0.0.1:20114;
    keepalive 16;
}

upstream tinkerbit_mqtt_ws {
    server 127.0.0.1:9001;
}

upstream tinkerbit_compile {
    server 127.0.0.1:20113;
    keepalive 4;
}

map $http_upgrade $tb_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tinkerbit.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on nginx 1.18 (Ubuntu 22.04) and later; newer nginx
    # (Amazon Linux 2023) accepts it with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tinkerbit.io;

    ssl_certificate /etc/letsencrypt/live/api.tinkerbit.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tinkerbit.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tb_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location = /healthz {
        proxy_pass http://tinkerbit_iot/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /iot/v1/live {
        limit_conn tb_iot_conn 20;
        proxy_pass http://tinkerbit_iot;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tb_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /iot/v1/live/ticket {
        limit_req zone=tb_iot_ticket burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://tinkerbit_iot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /iot/v1/ {
        # Browser calls arrive from Vercel edge IPs, so this is a coarse flood guard;
        # per-user limits are enforced by the service itself.
        limit_req zone=tb_iot_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://tinkerbit_iot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /mqtt {
        # A school behind one NAT address can have a whole class online.
        limit_conn tb_iot_conn 100;
        proxy_pass http://tinkerbit_mqtt_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tb_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Longer than max_keepalive (120 s) x 1.5 so idle boards are not cut off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /api/compile {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://tinkerbit_compile;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        return 404;
    }
}
