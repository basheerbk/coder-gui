# TinkerBit Cloud broker. Installed to /etc/mosquitto/conf.d/tinkerbit.conf.
# @DYNSEC_PLUGIN@ is replaced by install-on-ec2.sh with the plugin path for this distro.

per_listener_settings false
allow_anonymous false

# Per-device usernames, passwords, client ids and topic ACLs (tb/<id>/#).
plugin @DYNSEC_PLUGIN@
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Retained state + queued QoS 1 messages for the ingest session survive restarts.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# Abuse limits. Telemetry is capped at 2 KB by the firmware and the service;
# 4 KB leaves room for MQTT headers and dynsec admin commands.
max_packet_size 4096
max_inflight_messages 10
max_queued_messages 1000
max_keepalive 120
persistent_client_expiration 1d
set_tcp_nodelay true

log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp false

# Internal: the IoT service (ingest + dynsec admin). Never exposed.
listener 1883 127.0.0.1

# Internal: MQTT over WebSockets, published by nginx as wss://api.tinkerbit.io/mqtt
# for networks that block port 8883.
listener 9001 127.0.0.1
protocol websockets

# Public: boards connect here first (MQTT over TLS).
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
