# OpenBlock Link public front door + compile API.
# /openblock/  -> link WebSocket (20111)
# /            -> resource server (20112)
# /api/compile -> compile API (20113)

upstream openblock_link {
    server 127.0.0.1:20111;
    keepalive 8;
}

upstream openblock_resource {
    server 127.0.0.1:20112;
    keepalive 16;
}

upstream compile_api {
    server 127.0.0.1:20113;
    keepalive 4;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

    location /api/compile/health {
        proxy_pass http://compile_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/compile {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://compile_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /openblock/ {
        proxy_pass http://openblock_link;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://openblock_resource;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
